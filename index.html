<div id="stage"></div>
<div id="ui">

  </div>
  <div id="hudr" class="frame">

      <span><em class="coin"></em><b id="money"></b></span>
      <span id="bagstat" title="Рюкзак (Tab): занято слотов"><b id="slots"></b></span>
      <span id="wpn"><i class="ic" id="weapon"></i><b id="wpnname"></b><span id="ammobox" title="Патроны"><i class="ic" style="background-image:var(--ammo)"></i><b id="ammo"></b></span></span>

      <span id="o2box" title="Кислородные баллоны: сами срабатывают, когда кислород кончится" hidden><i class="ic" style="background-image:url(assets/icons/items/o2.png)"></i><b id="o2n"></b></span>

  </div>
  <div id="edge" hidden>!</div>
  <div id="dim" hidden></div>
  <div id="panel" class="frame" hidden></div>
  <div id="cine" hidden></div>
  <div id="toasts"></div>
  <div id="pnote" hidden></div>
  <div id="shiftfade" hidden></div>
